[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-streaming-parquet-chunker"
version = "0.1.0"
description = "Zero-copy columnar chunker converting streaming telemetry and tabular logs into context-optimized RAG chunks with schema metadata"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-streaming-parquet-chunker = "agent_streaming_parquet_chunker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_streaming_parquet_chunker*"]
